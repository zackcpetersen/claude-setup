<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one colored canvas, white cards on top. A top bar with a menu button opens a drawer listing every page. Overview is a grid of glanceable project cards; detail lives on each project page. Single look by design (same in light and dark). build.py can override the tokens from a theme file. */
:root{
  --canvas:#1F2A37; --on-canvas:#FFFFFF; --on-canvas-muted:rgba(255,255,255,.72); --canvas-line:rgba(255,255,255,.2);
  --card:#FFFFFF; --text:#4B5563; --strong:#111827; --muted:#7B8794; --line:#E5E9EC; --track:#E5E9EC;
  --accent:#2F7FBF; --accent-soft:#A9CDEA; --gray:#B8C0C8; --alert:#E5484D; --alert-ink:#C2333A; --link:#1A63B8;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --h-weight:600;
  color-scheme:light;
}
/*__THEME__*/
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--canvas)}
a{color:var(--link)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--canvas);border-bottom:1px solid var(--canvas-line)}
.bar-in{max-width:1080px;margin-inline:auto;display:flex;align-items:center;gap:14px;padding-block:10px;color:var(--on-canvas)}
.menu-btn{display:inline-flex;flex-direction:column;justify-content:center;gap:4px;width:40px;height:40px;padding:0 10px;border:1px solid var(--canvas-line);border-radius:8px;background:transparent;cursor:pointer;flex:none}
.menu-btn span{display:block;height:2px;background:var(--on-canvas);border-radius:1px}
.menu-btn:hover{background:rgba(255,255,255,.1)}
.bar .where{font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere}
.bar .asof{font-size:12px;color:var(--on-canvas-muted);white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.drawer{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);background:var(--card);z-index:21;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.drawer .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.drawer a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;color:var(--strong);text-decoration:none;font-size:14px;line-height:1.25}
.drawer a:hover{background:var(--line)}
.drawer a[aria-current="page"]{background:var(--line);font-weight:700}
.drawer .nm{flex:1;min-width:0}
.drawer .pc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.drawer .close{align-self:flex-end;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 10px;cursor:pointer;border-radius:6px}
main{padding-block:26px 64px}
.page{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--alert);color:#FFFFFF;font-size:12px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;flex:none}
.card{background:var(--card);border-radius:12px;padding:20px 22px;min-width:0}
h1{margin:0;font-size:26px;font-weight:var(--h-weight);line-height:1.1;color:var(--strong);text-wrap:balance;min-width:0}
h2{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .t{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.hero .nm{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--strong);white-space:nowrap}
.chip.late{border-color:var(--alert);color:var(--alert-ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.done{background:var(--accent)} .prog{background:var(--accent-soft)} .wait{background:var(--gray)} .block{background:var(--alert)} .none{background:var(--card);box-shadow:inset 0 0 0 2px var(--gray)}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--track);min-width:60px}
.sbar .seg{height:100%} .sbar .seg.none{background:var(--track);box-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px} .legend b{color:var(--strong);font-variant-numeric:tabular-nums}
/* overview */

.stats .n{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stats .s{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--on-canvas-muted)}
.stats .s .n{color:var(--on-canvas)}
.stats a{color:inherit;text-decoration:none} .stats a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
a.pc-card{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--text)}
a.pc-card:hover{box-shadow:0 0 0 2px var(--accent)}
.pc-top{display:flex;align-items:center;gap:14px}
.pc-name{flex:1;min-width:0;color:var(--strong);font-size:16px;font-weight:700;line-height:1.2}
.pc-next{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sect-on{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-canvas-muted);margin-top:10px}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.mini:first-of-type{border-top:0}
.mini .tx{flex:1;min-width:0;color:var(--strong)}
.mini .mt{font-size:12px;color:var(--muted);white-space:nowrap}
/* project page */
.needs{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.needs li{display:flex;gap:12px;align-items:flex-start}
.needs .dot{margin-top:6px}
.needs .ask{color:var(--strong);flex:1;min-width:0}
.sub{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.sum{margin:0;max-width:70ch}
.basis{font-size:12px;color:var(--muted);margin-top:8px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{display:flex;align-items:center;gap:14px;padding:12px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .g{flex:1;min-width:0;color:var(--strong);font-weight:700;font-size:14px}
summary .sbar{width:120px;flex:none}
summary .ct{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-right:4px}
details[open] summary::after{transform:rotate(-135deg)}
.item{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-start;padding:8px 0 8px 2px;border-top:1px dashed var(--line);font-size:14px}
.item .dot{margin-top:5px}
.item .tx{flex:1;min-width:200px}
.item .mt{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.is-done .tx{color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tools button{border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:12px;border-radius:999px;padding:3px 11px;cursor:pointer}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14px}
.plain .d{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.person{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.person .who{color:var(--strong);font-weight:700;font-size:15px;flex:1;min-width:0}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:var(--track);color:var(--strong);font-size:12px;font-weight:700;padding:0 6px}
.late{color:var(--alert-ink);font-weight:700}
.foot{font-size:12px;color:var(--on-canvas-muted)}
.ring text{font-family:var(--font);font-variant-numeric:tabular-nums}
@media (max-width:520px){ .card{padding:16px} summary .sbar{width:70px} h1{font-size:22px} .bar .asof{display:none} }
@media (prefers-reduced-motion:no-preference){ a.pc-card{transition:box-shadow .12s} }
</style>
